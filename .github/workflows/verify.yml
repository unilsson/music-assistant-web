name: verify
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci && npm run build
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
