name: Sprint 5A build check

on:
  push:
    branches:
      - feature/sprint-5a-music-home-playlists

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Repair and build backend
        working-directory: backend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit repaired backend lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "backend/package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: sync backend dependency lockfile"
          git push
